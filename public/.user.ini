; NewSlot - límite persistente para PHP-FPM / CGI.
; La aplicación aplica el mismo valor a Artisan y workers desde AppServiceProvider.
memory_limit=256M

; Cargas PBO de operativos (max 200 MiB): PHP-FPM/CGI.
; Para Laravel artisan serve, configurar también php.ini de la máquina.
upload_max_filesize=200M
post_max_size=210M
max_input_time=900
